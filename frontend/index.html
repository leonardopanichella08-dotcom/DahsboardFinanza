<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architetto Gestionale – Cruscotto Finanziario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0f1e;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:9px}
    input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:#1e293b;border-radius:9px;outline:none;cursor:pointer}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#6366f1;border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .shimmer{background:linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}
    .card{background:#0f172a;border:1px solid #1e293b;border-radius:14px}
    .card-hover{transition:border-color .2s,box-shadow .2s;cursor:pointer}
    .card-hover:hover{border-color:#6366f1;box-shadow:0 0 0 1px rgba(99,102,241,.3),0 8px 24px rgba(99,102,241,.1)}
    .btn{cursor:pointer;border:none;outline:none;background:transparent}
    .tag{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;font-size:11px;font-weight:600;padding:3px 10px}
    .kpi-positive{color:#10b981}
    .kpi-negative{color:#f43f5e}
    .kpi-neutral{color:#94a3b8}
    .section-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#475569;margin-bottom:12px}
    table{border-collapse:collapse;width:100%}
    td,th{padding:10px 14px;text-align:left}
    .gradient-text{background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .pulse{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .chip{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:4px 10px;font-size:11px;color:#94a3b8;font-weight:500}
  </style>
</head>
<body>
<div id="app" style="display:flex;height:100vh;overflow:hidden"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
const S = {
  session:null, values:{}, overrides:{},
  loading:false, error:null,
  baselineKpis:null,   // kpis at load time for delta comparison
  _subs:[],
  set(p){Object.assign(this,p);this._subs.forEach(f=>f());},
  sub(f){this._subs.push(f);}
};

// ─────────────────────────────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────────────────────────────
async function apiUpload(file){
  const fd=new FormData(); fd.append('file',file);
  const r=await fetch('/api/upload',{method:'POST',body:fd});
  const data=await r.json().catch(()=>null);
  if(!r.ok||data?.detail) throw new Error(data?.detail??r.statusText);
  return data;
}
async function apiSimulate(sid,overrides){
  const r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sid,overrides})});
  if(!r.ok) throw new Error('Simulazione fallita');
  return r.json();
}

// ─────────────────────────────────────────────────────────────────────────────
// Format helpers
// ─────────────────────────────────────────────────────────────────────────────
function fmtEur(v){
  if(v==null||isNaN(v)) return '—';
  const n=Number(v);
  if(Math.abs(n)>=1e6) return `€${(n/1e6).toFixed(2)}M`;
  if(Math.abs(n)>=1e3) return `€${(n/1e3).toFixed(1)}K`;
  return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
}
function fmtNum(v,unit){
  if(v==null||isNaN(Number(v))) return '—';
  const n=Number(v);
  if(unit==='%') return `${n.toFixed(1)}%`;
  if(unit==='mesi') return `${n.toFixed(1)} mesi`;
  if(unit==='x') return `${n.toFixed(2)}x`;
  if(unit==='€') return fmtEur(n);
  if(Math.abs(n)>=1e6) return `${(n/1e6).toFixed(1)}M`;
  if(Math.abs(n)>=1e3) return `${(n/1e3).toFixed(1)}K`;
  return n.toLocaleString('it-IT',{maximumFractionDigits:1});
}
function deltaColor(d){ return d>0?'#10b981':d<0?'#f43f5e':'#475569'; }
function deltaArrow(d){ return d>0?'▲':d<0?'▼':''; }

// ─────────────────────────────────────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────────────────────────────────────
function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className=v;
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='html') e.innerHTML=v;
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>c!=null&&e.append(typeof c==='string'?document.createTextNode(c):c));
  return e;
}
function svgIcon(d,color='#94a3b8',sz=16){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');
  s.setAttribute('stroke',color);s.setAttribute('stroke-width','1.5');
  s.style.cssText=`width:${sz}px;height:${sz}px;flex-shrink:0`;
  s.innerHTML=d;return s;
}

// ─────────────────────────────────────────────────────────────────────────────
// Upload handler
// ─────────────────────────────────────────────────────────────────────────────
async function doUpload(file){
  S.set({loading:true,error:null});
  try{
    const data=await apiUpload(file);
    S.set({
      session:data,
      values:data.resolved_values||{},
      overrides:{},
      baselineKpis:data.business_kpis||[],
      loading:false
    });
  }catch(e){
    S.set({loading:false,error:e.message});
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Scenario override
// ─────────────────────────────────────────────────────────────────────────────
async function doOverride(cellId,val){
  const n=parseFloat(val); if(isNaN(n)) return;
  const overrides={...S.overrides,[cellId]:n};
  S.set({overrides});
  if(!S.session) return;
  try{
    const r=await apiSimulate(S.session.session_id,overrides);
    S.set({values:r.values});
    // Recompute smart KPIs client-side after sim
    updateKpisAfterSim(r.values);
  }catch{}
}

function updateKpisAfterSim(newValues){
  // Re-extract business_kpis from updated resolved values
  // For now, just update the values in the existing KPIs
  if(!S.session) return;
  const updatedKpis=(S.session.business_kpis||[]).map(k=>{
    if(k.cell_id&&newValues[k.cell_id]!=null){
      return {...k, value:Number(newValues[k.cell_id])};
    }
    return k;
  });
  S.session.business_kpis_live=updatedKpis;
  S.set({}); // trigger re-render
}

// ─────────────────────────────────────────────────────────────────────────────
// Charts
// ─────────────────────────────────────────────────────────────────────────────
const _charts={};
function destroyChart(id){if(_charts[id]){_charts[id].destroy();delete _charts[id];}}

const chartDefaults={
  color:'#94a3b8',
  borderColor:'#1e293b',
  animation:{duration:400},
  plugins:{
    legend:{labels:{color:'#94a3b8',font:{family:'Inter',size:10},boxWidth:8,padding:12}},
    tooltip:{bodyFont:{size:11},titleFont:{size:11}}
  },
  scales:{
    x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#475569',font:{size:9},maxRotation:0,maxTicksLimit:8}},
    y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#475569',font:{size:9},maxTicksLimit:5,callback:v=>fmtNum(v,'')}}
  }
};

// Chart card with FIXED height wrapper so canvas never overflows
function makeChartCard(title,chartId){
  const card=h('div',{class:'card',style:{
    padding:'14px',display:'flex',flexDirection:'column',gap:'8px',
    minWidth:0,  /* prevent grid blowout */
  }});
  card.append(h('p',{style:{
    fontSize:'11px',fontWeight:600,color:'#475569',
    textTransform:'uppercase',letterSpacing:'.05em',flexShrink:0
  }},title));
  // Fixed-height wrapper: Chart.js reads this for sizing
  const wrap=h('div',{style:{position:'relative',height:'180px',width:'100%'}});
  const canvas=h('canvas',{id:chartId});
  wrap.append(canvas);
  card.append(wrap);
  return {card,canvas};
}

function buildAllCharts(container){
  container.innerHTML='';
  // Destroy all existing charts
  Object.keys(_charts).forEach(id=>{_charts[id].destroy();delete _charts[id];});

  const {session,values}=S; if(!session) return;
  const ts=session.time_series||[];

  const revSeries  =ts.filter(s=>s.category==='revenue').slice(0,2);
  const costSeries =ts.filter(s=>s.category==='costs').slice(0,2);
  const profitSeries=ts.filter(s=>s.category==='profit').slice(0,1);
  const userSeries =ts.filter(s=>s.category==='users'||s.category==='subscribers'||s.category==='cashflow').slice(0,2);

  const hasRevenue =revSeries.length>0||profitSeries.length>0;
  const hasCosts   =costSeries.length>0;
  const hasUsers   =userSeries.length>0;

  // Fallback: sum all numeric cells by column
  if(!hasRevenue&&!hasCosts&&!hasUsers){
    const byCols={};
    (session.cells||[]).forEach(c=>{
      if(c.type==='label') return;
      const v=Number(values[c.id]??c.value??0);
      if(!isNaN(v)&&v!==0) byCols[c.col]=(byCols[c.col]||0)+v;
    });
    const cols=Object.entries(byCols).sort(([a],[b])=>+a-+b).slice(0,16);
    if(cols.length>0) revSeries.push({label:'Totale per periodo',series:cols.map(([,v])=>v),n_periods:cols.length});
  }

  // Always 3-column grid, each chart takes 1 col
  const nCharts=[hasRevenue||revSeries.length>0,hasCosts,hasUsers].filter(Boolean).length||1;
  const grid=h('div',{style:{
    display:'grid',gap:'12px',
    gridTemplateColumns:`repeat(${Math.min(nCharts,3)},1fr)`,
    alignItems:'start'    /* prevent stretching */
  }});
  container.append(grid);

  function shorten(s){return s.length>28?s.slice(0,28)+'…':s;}
  const opts=(extra={})=>({
    ...chartDefaults,responsive:true,maintainAspectRatio:false,
    plugins:{
      ...chartDefaults.plugins,
      legend:{...chartDefaults.plugins.legend,
        display:true,position:'bottom',
        labels:{...chartDefaults.plugins.legend.labels,boxWidth:8,padding:10}},
    },
    ...extra
  });

  // ── Chart 1: Ricavi & Profitto ───────────────────────────────────────────
  if(revSeries.length>0||profitSeries.length>0){
    const all=[...revSeries,...profitSeries];
    const nP=Math.max(...all.map(s=>s.n_periods||0));
    const labels=[...Array(nP)].map((_,i)=>`M${i+1}`);
    const datasets=[
      ...revSeries.map((s,i)=>({
        label:shorten(s.label),data:s.series,
        borderColor:['#6366f1','#06b6d4'][i%2],
        backgroundColor:['rgba(99,102,241,.08)','rgba(6,182,212,.08)'][i%2],
        fill:true,tension:.35,borderWidth:2,pointRadius:2,pointHoverRadius:4,
      })),
      ...profitSeries.map(s=>({
        label:shorten(s.label),data:s.series,
        borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.06)',
        fill:true,tension:.35,borderWidth:2,borderDash:[5,3],pointRadius:0,
      }))
    ];
    const {card,canvas}=makeChartCard('Ricavi & Profitto','c-rev');
    grid.append(card);
    _charts['rev']=new Chart(canvas.getContext('2d'),{
      type:'line',data:{labels,datasets},
      options:opts({plugins:{...opts().plugins,tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtEur(c.parsed.y)}`}}}})
    });
  }

  // ── Chart 2: Struttura costi ─────────────────────────────────────────────
  if(costSeries.length>0){
    const nP=Math.max(...costSeries.map(s=>s.n_periods));
    const labels=[...Array(nP)].map((_,i)=>`M${i+1}`);
    const datasets=costSeries.map((s,i)=>({
      label:shorten(s.label),data:s.series,
      backgroundColor:['rgba(244,63,94,.75)','rgba(245,158,11,.75)'][i%2],
      borderRadius:2,borderSkipped:false,
    }));
    const {card,canvas}=makeChartCard('Struttura dei Costi','c-costs');
    grid.append(card);
    _charts['costs']=new Chart(canvas.getContext('2d'),{
      type:'bar',data:{labels,datasets},
      options:opts({
        scales:{
          x:{...chartDefaults.scales.x,stacked:true},
          y:{...chartDefaults.scales.y,stacked:true}
        },
        plugins:{...opts().plugins,tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtEur(c.parsed.y)}`}}}
      })
    });
  }

  // ── Chart 3: Clienti / Abbonamenti ───────────────────────────────────────
  if(userSeries.length>0){
    const nP=Math.max(...userSeries.map(s=>s.n_periods));
    const labels=[...Array(nP)].map((_,i)=>`M${i+1}`);
    const datasets=userSeries.map((s,i)=>({
      label:shorten(s.label),data:s.series,
      borderColor:['#8b5cf6','#f59e0b'][i%2],
      backgroundColor:['rgba(139,92,246,.08)','rgba(245,158,11,.08)'][i%2],
      fill:true,tension:.35,borderWidth:2,pointRadius:2,pointHoverRadius:4,
    }));
    const {card,canvas}=makeChartCard('Clienti & Abbonamenti','c-users');
    grid.append(card);
    _charts['users']=new Chart(canvas.getContext('2d'),{
      type:'line',data:{labels,datasets},
      options:opts({
        scales:{...chartDefaults.scales,y:{...chartDefaults.scales.y,ticks:{...chartDefaults.scales.y.ticks,callback:v=>fmtNum(v,'')}}},
        plugins:{...opts().plugins,tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtNum(c.parsed.y,'')}`}}}
      })
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// KPI card
// ─────────────────────────────────────────────────────────────────────────────
function kpiCard(kpi){
  const val=kpi.value;
  const baseKpi=(S.baselineKpis||[]).find(b=>b.id===kpi.id);
  const baseVal=baseKpi?.value;
  const delta=baseVal!=null&&baseVal!==0?(val-baseVal)/Math.abs(baseVal)*100:null;

  const accent=(CAT_META[kpi.category]||{color:'#6366f1'}).color;

  const card=h('div',{class:'card card-hover fade-in',style:{
    padding:'20px',position:'relative',overflow:'hidden',
  }});

  // Accent line top
  const accentBar=h('div',{style:{
    position:'absolute',top:0,left:0,right:0,height:'3px',
    background:accent,borderRadius:'14px 14px 0 0'
  }});
  card.append(accentBar);

  // Label
  card.append(h('p',{style:{
    fontSize:'11px',color:'#475569',fontWeight:600,
    textTransform:'uppercase',letterSpacing:'.05em',marginTop:'4px',lineHeight:'1.4'
  }},kpi.label));

  // Value
  const displayVal=fmtNum(val,kpi.unit);
  card.append(h('p',{style:{
    fontFamily:'JetBrains Mono,monospace',fontSize:'26px',fontWeight:700,
    marginTop:'8px',color:'#e2e8f0',letterSpacing:'-.02em'
  }},displayVal));

  // Delta badge
  if(delta!=null&&Math.abs(delta)>0.01){
    const sign=delta>0?'+':'';
    card.append(h('div',{style:{
      display:'flex',alignItems:'center',gap:'4px',marginTop:'8px'
    }},
      h('span',{style:{
        fontSize:'11px',fontWeight:700,
        color:deltaColor(delta),
        background:`${deltaColor(delta)}18`,
        borderRadius:'6px',padding:'2px 8px'
      }},`${deltaArrow(delta)} ${sign}${delta.toFixed(1)}% vs baseline`)
    ));
  }

  // Description
  if(kpi.description){
    card.append(h('p',{style:{
      fontSize:'11px',color:'#334155',marginTop:'10px',lineHeight:'1.5'
    }},kpi.description));
  }

  return card;
}

// ─────────────────────────────────────────────────────────────────────────────
// Scenario parameter slider
// ─────────────────────────────────────────────────────────────────────────────
function scenarioSlider(param){
  const wrap=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});

  const topRow=h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:'8px'}});
  const labelEl=h('p',{style:{fontSize:'12px',fontWeight:500,color:'#94a3b8',lineHeight:'1.4',flex:'1'}},param.label);
  const valEl=h('span',{style:{
    fontFamily:'JetBrains Mono,monospace',fontSize:'13px',fontWeight:700,
    color:'#e2e8f0',flexShrink:0,whiteSpace:'nowrap'
  }});

  const getCurrent=()=>Number(S.overrides[param.cell_id]??param.value??0);

  function refresh(){
    const v=getCurrent();
    valEl.textContent=fmtNum(v,param.unit);
  }
  refresh();
  topRow.append(labelEl,valEl);

  const slider=h('input',{type:'range',
    min:param.min,max:param.max,step:param.step,value:getCurrent()});
  slider.style.accentColor='#6366f1';

  // Number input
  const numEl=h('input',{type:'number',
    value:getCurrent(),step:param.step,min:param.min,max:param.max,
    style:{
      background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:'6px',
      padding:'4px 8px',fontFamily:'JetBrains Mono,monospace',
      fontSize:'12px',color:'#e2e8f0',outline:'none',width:'100px',
      textAlign:'right'
    }
  });
  numEl.onfocus=()=>numEl.style.borderColor='#6366f1';
  numEl.onblur=()=>{numEl.style.borderColor='#1e293b';commit(numEl.value);};
  numEl.onkeydown=e=>{if(e.key==='Enter')commit(numEl.value);};

  async function commit(raw){
    const n=parseFloat(raw); if(isNaN(n)) return;
    await doOverride(param.cell_id,n);
    slider.value=getCurrent();
    numEl.value=getCurrent();
    refresh();
  }
  slider.oninput=e=>{numEl.value=e.target.value;commit(e.target.value);};

  // Hint text
  const hint=h('p',{style:{fontSize:'10px',color:'#334155',lineHeight:'1.4'}},param.description);

  wrap.append(topRow,
    h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},slider,numEl),
    hint);
  return wrap;
}

// ─────────────────────────────────────────────────────────────────────────────
// Empty state
// ─────────────────────────────────────────────────────────────────────────────
function emptyState(){
  const w=h('div',{style:{
    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
    height:'100vh',gap:'28px',padding:'32px',textAlign:'center'
  }});
  // Logo area
  w.append(h('div',{style:{
    width:'80px',height:'80px',borderRadius:'20px',
    background:'linear-gradient(135deg,rgba(99,102,241,.2),rgba(139,92,246,.2))',
    border:'1px solid rgba(99,102,241,.3)',
    display:'flex',alignItems:'center',justifyContent:'center',fontSize:'32px'
  }},'📊'));

  w.append(h('div',{style:{maxWidth:'420px',display:'flex',flexDirection:'column',gap:'12px'}},
    h('h1',{style:{fontSize:'24px',fontWeight:700,letterSpacing:'-.03em'}},
      h('span',{class:'gradient-text'},'Architetto Gestionale')),
    h('p',{style:{fontSize:'14px',color:'#475569',lineHeight:'1.8'}},
      'Carica il tuo piano economico-finanziario in Excel. '+
      'Il sistema estrae automaticamente le metriche chiave che un investitore vuole vedere: '+
      'MRR, ARR, CAC, LTV, Churn, Margini e Runway.')
  ));

  // Feature chips
  const chips=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px',justifyContent:'center',maxWidth:'400px'}});
  ['📈 Analisi ricavi','💸 Struttura costi','🎯 Unit economics',
   '🔄 Churn & Retention','🚀 Scenario what-if','📉 Break-even'].forEach(t=>{
    chips.append(h('span',{class:'chip'},t));
  });
  w.append(chips);
  return w;
}

// ─────────────────────────────────────────────────────────────────────────────
// Upload drop zone
// ─────────────────────────────────────────────────────────────────────────────
function uploadZone(){
  const inp=h('input',{type:'file',accept:'.xlsx,.xls',style:{display:'none'}});
  inp.onchange=e=>{const f=e.target.files?.[0];if(f)doUpload(f);inp.value='';};
  let drag=false;
  const drop=h('button',{class:'btn',style:{
    width:'100%',borderRadius:'12px',
    border:`2px dashed ${drag?'#6366f1':'#1e293b'}`,
    padding:'20px 16px',textAlign:'center',transition:'all .2s',
    background:'transparent'
  },onClick:()=>inp.click()});
  drop.ondragover=e=>{e.preventDefault();drag=true;drop.style.borderColor='#6366f1';drop.style.background='rgba(99,102,241,.06)';};
  drop.ondragleave=()=>{drag=false;drop.style.borderColor='#1e293b';drop.style.background='';};
  drop.ondrop=e=>{e.preventDefault();drag=false;drop.style.borderColor='#1e293b';drop.style.background='';
    const f=e.dataTransfer.files[0];if(f)doUpload(f);};

  if(S.loading){
    drop.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div class="spin" style="width:22px;height:22px;border-radius:50%;border:2px solid #6366f1;border-top-color:transparent"></div>
      <p style="font-size:12px;color:#94a3b8">Analisi in corso…</p></div>`;
  } else {
    drop.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <span style="font-size:24px">📂</span>
      <p style="font-size:13px;font-weight:600;color:#e2e8f0">Carica Excel</p>
      <p style="font-size:11px;color:#475569">.xlsx · .xls · max 10 MB</p></div>`;
  }
  return h('div',{},drop,inp);
}

// ─────────────────────────────────────────────────────────────────────────────
// Category definitions (must match backend CATEGORY_META)
// ─────────────────────────────────────────────────────────────────────────────
const CAT_META={
  growth:        {label:'Ricavi & Crescita',    icon:'📈', color:'#6366f1'},
  unit_economics:{label:'Unit Economics',        icon:'🎯', color:'#8b5cf6'},
  profitability: {label:'Redditività & Margini', icon:'💰', color:'#10b981'},
  cash:          {label:'Cassa & Sostenibilità', icon:'🏦', color:'#06b6d4'},
  fundraising:   {label:'Funding & Valuation',   icon:'🚀', color:'#f59e0b'},
};
const CAT_ORDER=['growth','unit_economics','profitability','cash','fundraising'];

// ─────────────────────────────────────────────────────────────────────────────
// Main dashboard (investor view)
// ─────────────────────────────────────────────────────────────────────────────
function buildDashboard(session){
  const kpis=session.business_kpis_live||session.business_kpis||[];
  const params=session.scenario_params||[];

  const wrap=h('div',{style:{
    flex:'1',display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'
  }});

  // ── Top bar ───────────────────────────────────────────────────────────────
  const topbar=h('div',{style:{
    display:'flex',alignItems:'center',justifyContent:'space-between',
    padding:'12px 24px',borderBottom:'1px solid #1e293b',flexShrink:0,
    background:'rgba(10,15,30,.95)',backdropFilter:'blur(8px)'
  }});
  topbar.append(
    h('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
      h('span',{style:{fontSize:'18px'}},'📊'),
      h('div',{},
        h('p',{style:{fontSize:'13px',fontWeight:700,color:'#e2e8f0'}},
          session.filename?.replace(/\.xlsx?$/i,'')||'Piano Finanziario'),
        h('p',{style:{fontSize:'10px',color:'#334155',marginTop:'1px'}},
          `${session.sheets?.join(' · ')||''}  ·  ${session.cells?.length||0} celle  ·  ${kpis.length} metriche`)
      )
    ),
    h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
      h('button',{class:'btn',
        style:{fontSize:'11px',color:'#475569',padding:'6px 12px',
          border:'1px solid #1e293b',borderRadius:'8px'},
        onClick:()=>S.set({session:null,values:{},overrides:{},baselineKpis:null,error:null})
      },'← Nuovo file')
    )
  );
  wrap.append(topbar);

  // ── Body: left panel + main ───────────────────────────────────────────────
  const body=h('div',{style:{flex:'1',display:'flex',overflow:'hidden'}});
  wrap.append(body);

  // ── Left: scenario panel ──────────────────────────────────────────────────
  const sidebar=h('aside',{style:{
    width:'260px',flexShrink:0,overflowY:'auto',
    padding:'16px',borderRight:'1px solid #1e293b',
    display:'flex',flexDirection:'column',gap:'20px'
  }});
  sidebar.append(
    h('p',{class:'section-title'},'🎛  Scenario What-If'),
    h('p',{style:{fontSize:'11px',color:'#334155',lineHeight:'1.6'}},
      'Modifica i parametri chiave. Tutte le metriche si aggiornano in tempo reale.')
  );
  if(params.length===0){
    sidebar.append(h('div',{class:'card',style:{padding:'12px'}},
      h('p',{style:{fontSize:'11px',color:'#475569',lineHeight:'1.6'}},
        'Nessun parametro modificabile rilevato automaticamente.')));
  } else {
    const pw=h('div',{style:{display:'flex',flexDirection:'column',gap:'18px'}});
    params.slice(0,8).forEach(p=>pw.append(scenarioSlider(p)));
    sidebar.append(pw);
  }

  // ── Main content ──────────────────────────────────────────────────────────
  const main=h('main',{style:{flex:'1',overflowY:'auto',padding:'20px 24px',
    display:'flex',flexDirection:'column',gap:'24px'}});

  // ── 5-Category tab navigation ─────────────────────────────────────────────
  // Build per-category KPI maps
  const byCategory={};
  CAT_ORDER.forEach(c=>byCategory[c]=[]);
  kpis.forEach(k=>{
    if(byCategory[k.category]) byCategory[k.category].push(k);
  });

  if(kpis.length>0){
    // Tab state
    let activeTab='all';

    const tabSection=h('div',{style:{display:'flex',flexDirection:'column',gap:'0'}});

    // ── Summary strip: one hero number per category ───────────────────────
    const heroRow=h('div',{style:{
      display:'grid',gap:'10px',
      gridTemplateColumns:'repeat(5,1fr)',
      marginBottom:'16px'
    }});
    CAT_ORDER.forEach(cat=>{
      const meta=CAT_META[cat];
      const items=byCategory[cat];
      const hero=items[0];
      const heroVal=hero?fmtNum(hero.value,hero.unit):'—';
      const card=h('div',{class:'card card-hover',style:{
        padding:'14px 12px',cursor:'pointer',position:'relative',overflow:'hidden',
        borderTop:`3px solid ${meta.color}`
      },onClick:()=>switchTab(cat)});
      card.append(
        h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'}},
          h('span',{style:{fontSize:'14px'}},meta.icon),
          h('span',{style:{fontSize:'10px',fontWeight:600,color:'#475569',
            textTransform:'uppercase',letterSpacing:'.06em'}},meta.label)
        ),
        h('p',{style:{
          fontFamily:'JetBrains Mono,monospace',fontSize:'18px',fontWeight:700,
          color:'#e2e8f0',letterSpacing:'-.02em',marginBottom:'4px'
        }},heroVal),
        h('p',{style:{fontSize:'10px',color:'#334155'}},hero?hero.label:'Nessun dato'),
        h('p',{style:{fontSize:'10px',color:meta.color,marginTop:'4px',fontWeight:600}},
          `${items.length} metrica${items.length!==1?'e':''}`)
      );
      heroRow.append(card);
    });
    tabSection.append(heroRow);

    // ── Tab bar ────────────────────────────────────────────────────────────
    const tabBar=h('div',{style:{
      display:'flex',gap:'4px',borderBottom:'1px solid #1e293b',
      marginBottom:'16px',paddingBottom:'0'
    }});
    const tabs=[{id:'all',label:'Tutte le metriche',icon:'📊'},...CAT_ORDER.map(c=>({
      id:c,label:CAT_META[c].label,icon:CAT_META[c].icon,
      count:byCategory[c].length,color:CAT_META[c].color
    }))];

    const tabEls={};
    function switchTab(id){
      activeTab=id;
      Object.entries(tabEls).forEach(([tid,el])=>{
        const active=tid===id;
        const meta=CAT_META[tid];
        el.style.color=active?(meta?.color||'#6366f1'):'#475569';
        el.style.borderBottom=active?`2px solid ${meta?.color||'#6366f1'}`:'2px solid transparent';
        el.style.background=active?`${meta?.color||'#6366f1'}12`:'transparent';
      });
      renderTabContent(id);
    }

    tabs.forEach(t=>{
      const btn=h('button',{class:'btn',style:{
        padding:'8px 14px',fontSize:'12px',fontWeight:600,
        color:'#475569',borderBottom:'2px solid transparent',
        borderRadius:'8px 8px 0 0',transition:'all .15s',
        display:'flex',alignItems:'center',gap:'5px'
      },onClick:()=>switchTab(t.id)});
      btn.innerHTML=`<span style="font-size:13px">${t.icon}</span><span>${t.label}</span>`+
        (t.count!=null?`<span style="background:#1e293b;color:#94a3b8;font-size:10px;padding:1px 6px;border-radius:999px">${t.count}</span>`:'');
      tabBar.append(btn);
      tabEls[t.id]=btn;
    });
    tabSection.append(tabBar);

    // ── Tab content pane ───────────────────────────────────────────────────
    const contentPane=h('div',{style:{display:'flex',flexDirection:'column',gap:'20px'}});
    tabSection.append(contentPane);

    function renderTabContent(tab){
      contentPane.innerHTML='';
      if(tab==='all'){
        // Show all categories one below the other
        CAT_ORDER.forEach(cat=>{
          const items=byCategory[cat];
          if(!items.length) return;
          const meta=CAT_META[cat];
          const sec=h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
          sec.append(h('div',{style:{
            display:'flex',alignItems:'center',gap:'8px',
            paddingBottom:'8px',borderBottom:'1px solid #1e293b'
          }},
            h('span',{style:{fontSize:'15px'}},meta.icon),
            h('span',{style:{fontSize:'11px',fontWeight:700,letterSpacing:'.06em',
              textTransform:'uppercase',color:meta.color}},meta.label),
            h('span',{style:{fontSize:'10px',color:'#334155',marginLeft:'4px'}},
              `${items.length} indicatori`)
          ));
          const grid=h('div',{style:{
            display:'grid',gap:'10px',
            gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))'
          }});
          items.forEach(k=>grid.append(kpiCard(k)));
          sec.append(grid);
          contentPane.append(sec);
        });
      } else {
        const items=byCategory[tab]||[];
        const meta=CAT_META[tab];
        if(!items.length){
          contentPane.append(h('div',{class:'card',style:{padding:'20px'}},
            h('p',{style:{fontSize:'12px',color:'#475569',lineHeight:'1.7'}},
              `⚠️ Nessuna metrica "${meta.label}" rilevata nel documento. `+
              'Il sistema ricerca automaticamente questi valori nelle etichette delle celle. '+
              'Controlla che il piano Excel contenga le voci corrispondenti.')));
          return;
        }
        const grid=h('div',{style:{
          display:'grid',gap:'10px',
          gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))'
        }});
        items.forEach(k=>grid.append(kpiCard(k)));
        contentPane.append(grid);
      }
    }

    // Activate default tab
    switchTab('all');
    main.append(tabSection);
  } else {
    main.append(h('div',{class:'card',style:{padding:'20px'}},
      h('p',{style:{fontSize:'12px',color:'#475569',lineHeight:'1.7'}},
        '⚠️  Nessuna metrica finanziaria rilevata automaticamente. '+
        'Assicurati che le etichette delle celle nel tuo Excel contengano '+
        'termini come "fatturato", "costi", "abbonamenti", "churn", "arpu" ecc.')));
  }

  // ── Charts section ────────────────────────────────────────────────────────
  const chartsSection=h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
  chartsSection.append(h('p',{class:'section-title'},'📈  Analisi Temporale'));
  const chartsContainer=h('div');
  chartsSection.append(chartsContainer);
  main.append(chartsSection);
  setTimeout(()=>{
    Object.values(_charts).forEach(c=>c.destroy&&c.destroy());
    Object.keys(_charts).forEach(k=>delete _charts[k]);
    buildAllCharts(chartsContainer);
  },80);

  // ── Auto insights ─────────────────────────────────────────────────────────
  const insights=buildInsights(kpis);
  if(insights) main.append(insights);

  body.append(sidebar,main);
  return wrap;
}

// ─────────────────────────────────────────────────────────────────────────────
// Auto-generated insights
// ─────────────────────────────────────────────────────────────────────────────
function buildInsights(kpis){
  const notes=[];
  const byId=Object.fromEntries(kpis.map(k=>[k.id,k.value]));

  // LTV/CAC
  if(byId.ltv_cac!=null){
    const v=byId.ltv_cac;
    if(v>=3) notes.push({icon:'✅',color:'#10b981',text:`LTV/CAC = ${v.toFixed(2)}x — ottimo. Per ogni € speso in acquisizione ne recuperi ${v.toFixed(1)}x nel ciclo di vita del cliente.`});
    else if(v>=1) notes.push({icon:'⚠️',color:'#f59e0b',text:`LTV/CAC = ${v.toFixed(2)}x — sotto il target 3x. Considera di ridurre il CAC o aumentare il prezzo/retention.`});
    else notes.push({icon:'🔴',color:'#f43f5e',text:`LTV/CAC = ${v.toFixed(2)}x — critico. Stai perdendo denaro su ogni cliente acquisito.`});
  }

  // Cash runway
  if(byId.cash_runway!=null){
    const v=byId.cash_runway;
    if(v<6) notes.push({icon:'🔴',color:'#f43f5e',text:`Runway di soli ${v.toFixed(0)} mesi — zona critica. Serve raccolta fondi immediata o riduzione del burn rate.`});
    else if(v<12) notes.push({icon:'⚠️',color:'#f59e0b',text:`Runway di ${v.toFixed(0)} mesi — sotto i 12 mesi. Pianifica il prossimo round di finanziamento.`});
    else notes.push({icon:'✅',color:'#10b981',text:`Runway di ${v.toFixed(0)} mesi — situazione di cassa sana.`});
  }

  // Gross margin
  if(byId.gross_margin_pct!=null){
    const v=byId.gross_margin_pct;
    if(v>70) notes.push({icon:'✅',color:'#10b981',text:`Gross Margin ${v.toFixed(1)}% — eccellente per un modello SaaS. Alta scalabilità.`});
    else if(v>40) notes.push({icon:'📊',color:'#6366f1',text:`Gross Margin ${v.toFixed(1)}% — nella norma. Spazio per migliorare ottimizzando i costi diretti.`});
    else if(v>0) notes.push({icon:'⚠️',color:'#f59e0b',text:`Gross Margin ${v.toFixed(1)}% — basso. Valuta aumenti di prezzo o riduzione dei costi del servizio.`});
    else notes.push({icon:'🔴',color:'#f43f5e',text:`Gross Margin ${v.toFixed(1)}% — negativo. I costi diretti superano i ricavi.`});
  }

  // NRR
  if(byId.nrr!=null){
    const v=byId.nrr;
    if(v>=120) notes.push({icon:'🚀',color:'#6366f1',text:`NRR ${v.toFixed(1)}% — eccellente! Cresci senza aggiungere nuovi clienti grazie all'espansione della base esistente.`});
    else if(v>=100) notes.push({icon:'✅',color:'#10b981',text:`NRR ${v.toFixed(1)}% — stabile, la base clienti non si erode.`});
    else notes.push({icon:'⚠️',color:'#f59e0b',text:`NRR ${v.toFixed(1)}% — sotto il 100%. Stai perdendo ricavi dalla base clienti esistente.`});
  }

  // EBITDA margin
  if(byId.ebitda_margin!=null){
    const v=byId.ebitda_margin;
    if(v>20) notes.push({icon:'✅',color:'#10b981',text:`EBITDA Margin ${v.toFixed(1)}% — operativamente profittevole.`});
    else if(v>0) notes.push({icon:'📊',color:'#06b6d4',text:`EBITDA Margin ${v.toFixed(1)}% — marginalmente positivo. Focus sulla leva operativa.`});
    else notes.push({icon:'⚠️',color:'#f59e0b',text:`EBITDA Margin ${v.toFixed(1)}% — ancora in perdita operativa. Monitora il burn rate.`});
  }

  // Revenue CAGR
  if(byId.cagr_revenue!=null){
    const v=byId.cagr_revenue;
    if(v>100) notes.push({icon:'🚀',color:'#6366f1',text:`CAGR Ricavi ${v.toFixed(1)}% — crescita esplosiva. Assicurati che l'infrastruttura scala di conseguenza.`});
    else if(v>30) notes.push({icon:'📈',color:'#10b981',text:`CAGR Ricavi ${v.toFixed(1)}% — crescita solida, attrattiva per investitori.`});
    else if(v>0) notes.push({icon:'📊',color:'#475569',text:`CAGR Ricavi ${v.toFixed(1)}% — crescita moderata. Valuta levette di accelerazione.`});
  }

  if(notes.length===0) return null;

  const sec=h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  sec.append(h('p',{class:'section-title'},'🔍  Analisi Automatica'));
  const list=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  notes.forEach(n=>{
    list.append(h('div',{class:'card',style:{
      padding:'12px 16px',display:'flex',alignItems:'flex-start',gap:'12px',
      borderLeft:`3px solid ${n.color}`
    }},
      h('span',{style:{fontSize:'16px',flexShrink:0,marginTop:'1px'}},n.icon),
      h('p',{style:{fontSize:'12px',lineHeight:'1.7',color:'#94a3b8'}},n.text)
    ));
  });
  sec.append(list);
  return sec;
}

// ─────────────────────────────────────────────────────────────────────────────
// Root render
// ─────────────────────────────────────────────────────────────────────────────
const app=document.getElementById('app');

function render(){
  // Determine layout
  let layout;
  if(!S.session){
    // Full-page empty/upload state
    const page=h('div',{style:{flex:'1',display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',padding:'32px',position:'relative'}});

    // Top-left logo
    const logo=h('div',{style:{
      position:'absolute',top:'16px',left:'24px',
      display:'flex',alignItems:'center',gap:'8px'
    }},
      h('span',{style:{fontSize:'16px'}},'📊'),
      h('span',{style:{fontSize:'13px',fontWeight:700,color:'#475569'}},
        'Architetto Gestionale')
    );
    page.append(logo);
    page.append(emptyState());

    // Upload zone centered
    const uploadWrap=h('div',{style:{width:'320px',marginTop:'8px'}});
    const uz=h('div',{class:'',style:{
      background:'#0f172a',border:'1px solid #1e293b',borderRadius:'14px',padding:'24px'
    }});
    const inp=h('input',{type:'file',accept:'.xlsx,.xls',style:{display:'none'}});
    inp.onchange=e=>{const f=e.target.files?.[0];if(f)doUpload(f);inp.value='';};
    let drag=false;
    const drop=h('div',{style:{
      borderRadius:'10px',border:`2px dashed ${S.loading?'#6366f1':'#1e293b'}`,
      padding:'24px 16px',textAlign:'center',cursor:'pointer',transition:'all .2s',
    },onClick:()=>inp.click()});
    drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#6366f1';drop.style.background='rgba(99,102,241,.06)';};
    drop.ondragleave=()=>{drop.style.borderColor='#1e293b';drop.style.background='';};
    drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='#1e293b';drop.style.background='';
      const f=e.dataTransfer.files[0];if(f)doUpload(f);};
    if(S.loading){
      drop.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div class="spin" style="width:24px;height:24px;border-radius:50%;border:2px solid #6366f1;border-top-color:transparent"></div>
        <p style="font-size:13px;color:#94a3b8">Analisi in corso…</p>
        <p style="font-size:11px;color:#334155">Estrazione KPI e time series</p></div>`;
    } else {
      drop.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span style="font-size:32px">📂</span>
        <p style="font-size:14px;font-weight:600;color:#e2e8f0">Trascina il tuo Excel qui</p>
        <p style="font-size:11px;color:#475569">.xlsx o .xls · max 10 MB</p></div>`;
    }
    uz.append(drop,inp);
    if(S.error) uz.append(h('div',{style:{
      marginTop:'12px',background:'rgba(244,63,94,.1)',color:'#f43f5e',
      borderRadius:'8px',padding:'10px 12px',fontSize:'12px',lineHeight:'1.5'
    }},`❌ ${S.error}`));
    uploadWrap.append(uz);
    page.append(uploadWrap);

    layout=page;
  } else {
    layout=buildDashboard(S.session);
  }

  app.innerHTML='';
  app.append(layout);
}

S.sub(render);
render();
</script>
</body>
</html>
